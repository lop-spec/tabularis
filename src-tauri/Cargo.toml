[package]
name = "tabularis"
version = "0.18.1"
description = "tabularis - A database manager for developers"
authors = ["Debba"]
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "tabularis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.devfast]
inherits = "release"
# The app crate itself is glue; O1 keeps its rebuild fast. The hot paths
# (sqlx, tokio, serde, sql parsing) live in dependencies, which stay at O3
# below and are compiled once. Same definition as the tabularis-native-cli-ssh
# tree, so the dev launcher can run either build the same way.
opt-level = 1
lto = false
codegen-units = 16
incremental = true
debug = 1
strip = false

[profile.devfast.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.2", features = ["protocol-asset", "devtools"] }
tauri-plugin-log = "2"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "mysql", "postgres", "tls-rustls-ring-native-roots", "chrono", "uuid", "rust_decimal", "json"] }
tokio = { version = "1.49.0", features = ["full"] }
openssl = { version = "0.10", features = ["vendored"] }
uuid = { version = "1.20.0", features = ["v4", "serde"] }
rust_decimal = { version = "1.36", features = ["db-tokio-postgres", "serde"] }
chrono = { version = "0.4.43", features = ["serde"] }
chrono-tz = "0.10"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-fs = "2.4.5"
tauri-plugin-notification = "2"
russh = "0.43"
russh-keys = "0.43"
async-trait = "0.1"
urlencoding = "2.1.3"
base64 = "0.22.1"
infer = "0.16"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
regex = "1.12"
futures = "0.3.31"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
tauri-plugin-opener = "2"
once_cell = "1.20"
csv = "1.4.0"
reqwest = { version = "0.13.1", features = ["json"] }
clap = { version = "4.5.56", features = ["derive"] }
directories = "6.0.0"
which = "7.0.3"
sysinfo = { version = "0.32", features = ["system"] }
zip = "4.2.0"
url = "2"
semver = "1"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
tokio-postgres = { version = "0.7.13", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1", "array-impls"] }
deadpool-postgres = "0.14.1"
# sqlx uses `tls-rustls-ring-native-roots` for both the MySQL pool and the
# SQLite/embedded paths. `tls-native-tls` is intentionally NOT enabled:
# macOS Secure Transport (the native-tls backend on Darwin) is deprecated
# by Apple and trips opaque errors like "One or more parameters passed to
# a function were not valid" on real-world CA bundles (e.g. the AWS RDS
# regional CA bundle), even when the same bundle validates fine with
# `openssl s_client` and `mysql --ssl-mode=VERIFY_IDENTITY`. rustls has
# no such restriction. The `ring-native-roots` flavour keeps the OS trust
# store active (so non-IAM users who rely on a corporate CA in the macOS
# keychain still work) instead of falling back to the bundled `webpki-roots`
# (which would silently ignore those CAs). The PostgreSQL deadpool path
# uses rustls + `rustls-platform-verifier` for the same reason.
tokio-postgres-rustls = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2"
rustls-platform-verifier = "0.6"
ulid = "1.2.1"
argon2 = "0.5"
aes-gcm = "0.10"
# Foreign-app connection import: plist (TablePlus/Sequel Ace), XML (DataGrip).
# AES/MD5 decryption (DBeaver, Beekeeper) reuses the existing `openssl` dep.
plist = "1.7"
roxmltree = "0.20"
portable-pty = "0.9.0"

# GTK dependencies for Wayland window title workaround (Linux only)
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# WebView2 COM access for suspending the hidden main window (close-to-hide
# keeps the process warm; suspending drops most of the WebView's memory).
# Versions pinned to what wry 0.54 already pulls in — no new tree entries.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[dev-dependencies]
tempfile = "3.24.0"
filetime = "0.2"

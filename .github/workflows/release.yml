name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing tag to build and publish (for example v0.17.1)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  publish-portable:
    name: Build and publish Windows portable EXE
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Resolve tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
            echo "ref=refs/tags/${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.meta.outputs.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      # One build produces both artifacts: the release EXE that the portable
      # packager consumes, and the NSIS installer. Building twice would just
      # relink the same binary.
      #
      # tauri.nsis.conf.json turns off createUpdaterArtifacts. Signing those
      # requires a private key matching plugins.updater.pubkey, which this
      # repository does not hold - see 080d6244, which stripped the signed
      # build path from this workflow for exactly that reason. Producing a
      # bundle re-enabled it and broke the build; the installer itself needs
      # no signing key. The updater endpoint points at the upstream repo and
      # was never live here anyway.
      - name: Build portable executable and NSIS installer
        run: pnpm tauri build --bundles nsis --ci --config src-tauri/tauri.nsis.conf.json

      - name: Package and verify portable executable
        env:
          TABULARIS_PORTABLE_VERSION: ${{ steps.meta.outputs.tag }}
        run: node scripts/package-windows-portable.mjs

      - name: Scan public source and executable
        run: node scripts/check-public-artifact.mjs --artifact src-tauri/target/release/tabularis.exe

      - name: Create or update published Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.meta.outputs.tag }}
        run: |
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG_NAME" \
              --verify-tag \
              --title "$TAG_NAME" \
              --notes "Windows x64. Use the *-setup.exe installer (per-user, no admin prompt; upgrades an existing install in place, so there is no need to uninstall the previous version first), or tabularis-portable-*.exe to run directly without installing." \
              --repo "$GITHUB_REPOSITORY"
          fi
          gh release upload "$TAG_NAME" dist/portable/* --clobber --repo "$GITHUB_REPOSITORY"
          # Bundle path carries the version, so glob it rather than hardcoding.
          gh release upload "$TAG_NAME" \
            src-tauri/target/release/bundle/nsis/*-setup.exe \
            --clobber --repo "$GITHUB_REPOSITORY"
